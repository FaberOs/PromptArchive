name: Build Prompt Archive release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend (static export)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Create backend venv
        run: |
          python -m venv venv
          ./venv/Scripts/python -m pip install --upgrade pip
          ./venv/Scripts/python -m pip install -r backend/requirements.txt

      - name: Install desktop build dependencies
        working-directory: electron
        run: npm ci

      - name: Package NSIS installer
        working-directory: electron
        run: npx electron-builder --win nsis

      - name: Smoke test packaged app
        shell: pwsh
        env:
          PA_SMOKE_TEST: "1"
        run: |
          $output = & ".\release\win-unpacked\Prompt Archive.exe" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Packaged app exited with code $LASTEXITCODE" }
          if ($output -notmatch "PA_SMOKE_OK") { throw "Smoke test failed: $output" }
          Write-Host $output

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: prompt-archive-installer
          path: |
            release/Prompt Archive Setup *.exe
            release/Prompt Archive Setup *.exe.blockmap
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Prompt Archive Setup *.exe
            release/Prompt Archive Setup *.exe.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
